<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found &mdash; ELEVÉ luxury wear.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>É</text></svg>">
  <title>404 &mdash; ELEVÉ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header (Max Fashion Inspired) -->
  <header class="header" id="header" role="banner">
    <div class="container header-main">
      <div class="header-left">
        <a href="index.html" class="nav-logo" aria-label="ELEVÉ Home">ELEVÉ</a>
      </div>

      <!-- Max Fashion Inline Search -->
      <div class="header-search-box">
        <span class="header-search-icon">🔍</span>
        <input type="search" id="headerSearchInput" class="header-search-input" placeholder="What are you looking for?" autocomplete="off" aria-label="What are you looking for?">
      </div>

      <!-- Header Utilities -->
      <div class="header-actions">
        <button class="btn-auth-pill" id="authBtn">SIGN UP / SIGN IN</button>

        <button class="header-action-item" id="wishlistNavBtn" aria-label="Favourites">
          <span class="action-icon">♡</span>
          <span class="action-label">Favourites</span>
          <span class="wishlist-count" aria-live="polite">0</span>
        </button>

        <button class="header-action-item" id="cartBtn" aria-label="Basket">
          <span class="action-icon">🛍️</span>
          <span class="action-label">Basket</span>
          <span class="cart-count" id="cartCount" aria-live="polite">0</span>
        </button>

        <div class="header-more-dropdown">
          <button class="header-action-item" id="moreNavBtn" aria-label="More options">
            <span class="action-icon">⋮</span>
            <span class="action-label">More</span>
          </button>
          <div class="more-menu" id="moreMenu">
            <a href="products.html">All Products</a>
            <a href="about.html">About Brand</a>
            <a href="contact.html">Customer Care</a>
          </div>
        </div>

        <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <!-- Category Thumbnail Strip (Women, Men, Kids) -->
    <div class="category-strip-wrapper">
      <div class="container">
        <div class="category-strip" role="navigation" aria-label="Categories">
          <a href="women.html" class="category-card-pill">
            <div class="category-img-circle">
              <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=240&h=240&fit=crop&q=80" alt="Women" loading="lazy">
            </div>
            <span class="category-card-name">Women</span>
          </a>

          <a href="men.html" class="category-card-pill">
            <div class="category-img-circle">
              <img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=240&h=240&fit=crop&q=80" alt="Men" loading="lazy">
            </div>
            <span class="category-card-name">Men</span>
          </a>

          <a href="kids.html" class="category-card-pill">
            <div class="category-img-circle">
              <img src="https://images.unsplash.com/photo-1622290291468-a28f7a7dc6a8?w=240&h=240&fit=crop&q=80" alt="Kids" loading="lazy">
            </div>
            <span class="category-card-name">Kids</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Nav -->
  <div class="mobile-nav" id="mobileNav" role="navigation" aria-label="Mobile navigation">
    <a href="index.html">Home</a>
    <a href="men.html">Men</a>
    <a href="women.html">Women</a>
    <a href="kids.html">Kids</a>
    <a href="products.html">Shop All</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>

  <main class="page-404">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div style="display:flex;gap:var(--sp-md);flex-wrap:wrap;justify-content:center">
      <a href="index.html" class="btn btn-primary">Back to Home</a>
      <a href="products.html" class="btn btn-outline">Browse Shop</a>
    </div>
  </main>

  <!-- Fixed Persistent Bottom Action Bar (Constant while scrolling) -->
  <nav class="bottom-action-bar" id="bottomActionBar" aria-label="Persistent bottom navigation">
    <a href="index.html" class="bottom-bar-item" id="bottomHomeBtn">
      <span class="bottom-bar-icon">🏠</span>
      <span class="bottom-bar-label">Home</span>
    </a>
    <a href="products.html" class="bottom-bar-item" id="bottomShopBtn">
      <span class="bottom-bar-icon">🛍️</span>
      <span class="bottom-bar-label">Shop</span>
    </a>
    <button class="bottom-bar-item" id="bottomSearchBtn" aria-label="Search">
      <span class="bottom-bar-icon">🔍</span>
      <span class="bottom-bar-label">Search</span>
    </button>
    <button class="bottom-bar-item" id="bottomWishlistBtn" aria-label="Wishlist">
      <span class="bottom-bar-icon">♡</span>
      <span class="bottom-bar-label">Wishlist</span>
      <span class="wishlist-count" aria-live="polite">0</span>
    </button>
    <button class="bottom-bar-item" id="bottomCartBtn" aria-label="Checkout / Cart">
      <span class="bottom-bar-icon">🛒</span>
      <span class="bottom-bar-label">Checkout</span>
      <span class="cart-count" aria-live="polite">0</span>
    </button>
  </nav>

  <script src="product-data.js"></script>
  <script src="product-data-extra.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
